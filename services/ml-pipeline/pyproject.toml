[project]
name = "virtual-tryon-ml"
version = "3.0.0"
description = "VirtualFit ML Pipeline — YouCam API (Perfect Corp cloud inference)"
requires-python = ">=3.11"

dependencies = [
    # Web framework
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "python-multipart>=0.0.9",
    # Image processing (lightweight — no torch needed)
    "Pillow>=10.4.0",
    # HTTP client (for YouCam API calls)
    "requests>=2.32.0",
    "httpx>=0.27.0",
    # Image storage (MinIO S3-compatible)
    "boto3>=1.35.0",
    # DAPR SDK
    "dapr>=1.14.0",
    "dapr-ext-fastapi>=1.14.0",
    # Utilities
    "numpy>=1.26.0,<2.0.0",
    "python-dotenv>=1.0.0",
    "pydantic>=2.8.0",
    "pydantic-settings>=2.4.0",
]

[tool.uv]
dev-dependencies = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "httpx>=0.27.0",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
