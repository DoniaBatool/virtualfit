[project]
name = "virtual-tryon-ml"
version = "0.1.0"
description = "Virtual Try-On ML Pipeline — IDM-VTON + SAM2 + MediaPipe + TensorFlow"
requires-python = ">=3.11"

dependencies = [
    # Web framework
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "python-multipart>=0.0.9",

    # PyTorch (M2 Mac — MPS backend built-in)
    "torch>=2.5.0",
    "torchvision>=0.20.0",
    "torchaudio>=2.5.0",

    # Diffusers (IDM-VTON, CatVTON, Stable Diffusion)
    "diffusers>=0.30.0",
    "transformers>=4.44.0",
    "accelerate>=0.33.0",

    # TensorFlow (M2 Mac — tensorflow-macos + tensorflow-metal)
    "tensorflow-macos>=2.16.0",
    "tensorflow-metal>=1.1.0",

    # Body measurement + segmentation
    "mediapipe>=0.10.14",
    "Pillow>=10.4.0",
    "opencv-contrib-python>=4.10.0",

    # Quantum computing
    "qiskit>=1.2.0",
    "qiskit-aer>=0.14.0",

    # SAM2 (Meta Segment Anything Model 2)
    "sam2>=1.0.0",

    # HuggingFace Hub (model download + caching)
    "huggingface-hub>=0.24.0",

    # Image storage (MinIO S3-compatible)
    "boto3>=1.35.0",

    # DAPR SDK
    "dapr>=1.14.0",
    "dapr-ext-fastapi>=1.14.0",

    # Utilities
    "numpy>=1.26.0,<2.0.0",
    "python-dotenv>=1.0.0",
    "httpx>=0.27.0",
    "pydantic>=2.8.0",
    "pydantic-settings>=2.4.0",
]

[tool.uv]
dev-dependencies = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "httpx>=0.27.0",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
