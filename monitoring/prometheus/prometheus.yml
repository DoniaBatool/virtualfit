global:
  scrape_interval: 15s

scrape_configs:
  - job_name: "gateway"
    static_configs:
      - targets: ["host.docker.internal:3004"]

  - job_name: "ml-pipeline"
    static_configs:
      - targets: ["host.docker.internal:8001"]

  - job_name: "image-processor"
    static_configs:
      - targets: ["host.docker.internal:8090"]
