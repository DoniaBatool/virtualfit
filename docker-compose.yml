services:
  # ─── MinIO (Image Storage — S3-compatible) ─────────────────────────────────
  # Stores try-on result images locally (S3-compatible)
  minio:
    image: minio/minio:latest
    container_name: vt_minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # Web console → http://localhost:9001
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3

  # ─── PostgreSQL (optional — for future user accounts) ──────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: vt_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: virtual_tryon
      POSTGRES_USER: vtuser
      POSTGRES_PASSWORD: vtpass
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vtuser -d virtual_tryon"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  minio_data:
  postgres_data:
